# Production docker-compose to build UI and run backend with Postgres
version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recon
      POSTGRES_USER: recon_user
      POSTGRES_PASSWORD: change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./mock-backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://recon_user:change_me@postgres:5432/recon
      - JWT_SECRET=change_this_secret
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]

  ui:
    build:
      context: ./enterprise-recon-ui
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    environment:
      - VITE_API_BASE=http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
