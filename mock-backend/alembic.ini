from sqlmodel import Session, select
from .db import engine
from .models import User, Exception, Candidate, Audit, Account, JournalEntry, Posting, FxRate
from .auth import get_password_hash


def create_initial_data():
    with Session(engine) as session:
        existing_admin = session.exec(select(User).where(User.username == "admin")).first()
        if not existing_admin:
            session.add(User(username="admin", hashed_password=get_password_hash("adminpass"), role="admin"))
        existing_reviewer = session.exec(select(User).where(User.username == "reviewer")).first()
        if not existing_reviewer:
            session.add(User(username="reviewer", hashed_password=get_password_hash("reviewerpass"), role="reviewer"))

        if session.exec(select(Account).where(Account.account_code == "cash_bank_inr")).first() is None:
            session.add_all([
                Account(account_code="cash_bank_inr", account_name="Bank Cash - INR", account_type="bank", currency="INR"),
                Account(account_code="gateway_clearing_inr", account_name="Gateway Clearing - INR", account_type="clearing", currency="INR"),
                Account(account_code="merchant_revenue_inr", account_name="Merchant Revenue - INR", account_type="revenue", currency="INR"),
                Account(account_code="gateway_fee_inr", account_name="Gateway Fee - INR", account_type="fees", currency="INR"),
                Account(account_code="suspense_inr", account_name="Suspense - INR", account_type="suspense", currency="INR"),
                Account(account_code="tax_payable_inr", account_name="Tax Payable - INR", account_type="tax", currency="INR"),
            ])

        if session.exec(select(FxRate).where(FxRate.quote_currency == "USD")).first() is None:
            session.add(FxRate(base_currency="INR", quote_currency="USD", rate=0.012, valid_from=None))

        if session.exec(select(Exception)).first() is None:
            exc = Exception(exception_type="unmatched_deposit", reason="Seeded unmatched deposit", amount=2500.0, priority="high", status="open", transaction_id="txn-pay_123")
            session.add(exc)
            session.commit()
            session.refresh(exc)
            candidate = Candidate(exception_id=exc.id, bank_settlement_id="bank-settle-001", amount=2500.0, payment_ts=1700000000, payment_method="upi", bank_ref="UTR123456", match_score=0.94)
            session.add(candidate)
            session.add(Audit(exception_id=exc.id, actor="system", action="created", note=None))

        session.commit()
