version: "3.9"

services:
  mock-backend:
    build:
      context: ./mock-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://recon_user:change_me@postgres:5432/recon
      - JWT_SECRET=dev_secret_change_me
    depends_on:
      - postgres
    restart: unless-stopped

  ui:
    build:
      context: ./enterprise-recon-ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://mock-backend:8000/api/v1
    depends_on:
      - mock-backend
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: recon
      POSTGRES_USER: recon_user
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
